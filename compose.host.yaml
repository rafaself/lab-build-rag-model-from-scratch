# Optional Linux override for VPN/firewall setups that block Docker bridge traffic.
# Enable in .env with COMPOSE_FILE=compose.yaml:compose.host.yaml.
services:
  postgres:
    network_mode: host
    ports: !reset []
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -p
      - "${POSTGRES_PORT:-55432}"
    environment:
      PGPORT: ${POSTGRES_PORT:-55432}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p \"$$PGPORT\" -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
