name: lab-build-rag-model-from-scratch

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPORT: ${POSTGRES_PORT:-55432}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-p", "${POSTGRES_PORT:-55432}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p \"$$PGPORT\" -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
